[package]
name = "mtt-core"
description = "Pure, deterministic domain core of MTT Tournament Director"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# TypeScript bindings via ts-rs. The crate's own tests always derive them.
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
ts-rs = { version = "12", optional = true }

[dev-dependencies]
ts-rs = "12"
proptest = "1"
