name: End-to-end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-web:
    name: Browser demo (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/web/
          retention-days: 14

  # The real desktop app, driven through the WebDriver server it embeds when built with the
  # `e2e` cargo feature: the same suite as `npm run e2e:desktop` on macOS, here under a virtual
  # X display. It compiles the whole app, so it runs on main and on demand, not on every PR.
  e2e-desktop:
    name: Desktop app (WebdriverIO, Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci
      # WebKitGTK sandboxes its web processes in user namespaces, which Ubuntu 24.04 reserves
      # to programs with an AppArmor profile by default.
      - name: Allow the WebKit sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests
        run: xvfb-run -a npm run e2e:desktop
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wdio-logs
          path: test-results/desktop/
          retention-days: 14
