name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Front end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci
      - name: No getrandom in the WASM engine
        run: |
          tree="$(cargo tree -p mtt-wasm -e normal --target wasm32-unknown-unknown)"
          if grep -q getrandom <<<"$tree"; then
            echo "::error::mtt-wasm must not depend on getrandom"
            exit 1
          fi
      - name: WASM engine
        run: npm run wasm
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (regenerate src/bindings)
        run: |
          rm -rf src/bindings
          cargo test --workspace --locked
      - name: TypeScript bindings are up to date
        run: |
          git diff --exit-code -- src/bindings
          untracked="$(git ls-files --others --exclude-standard -- src/bindings)"
          if [ -n "$untracked" ]; then
            echo "::error::Untracked generated bindings, run cargo test and commit them:"
            echo "$untracked"
            exit 1
          fi
      - name: WASM build
        run: cargo build -p mtt-core --target wasm32-unknown-unknown --locked
      - name: No getrandom in the core
        run: |
          tree="$(cargo tree -p mtt-core -e normal --target wasm32-unknown-unknown)"
          if grep -q getrandom <<<"$tree"; then
            echo "::error::mtt-core must not depend on getrandom"
            exit 1
          fi
