<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824" width="824" height="824">
  <!-- MTT Tournament Director app icon: a poker chip whose inlay is a countdown clock. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172A4F"/>
      <stop offset="1" stop-color="#0C1631"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square tile; the favicon crops the viewBox to the tile so it fills browser tabs -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
  <!-- Chip: drop shadow, edge thickness, face -->
  <circle cx="512" cy="534" r="300" fill="#050B19" opacity="0.45"/>
  <circle cx="512" cy="524" r="300" fill="#B8741A"/>
  <circle cx="512" cy="512" r="300" fill="#F3A83B"/>
  <!-- Six edge inserts: dashes on a ring (r = 268, circumference / 6 = 280.649) -->
  <circle cx="512" cy="512" r="268" fill="none" stroke="#0C1631" stroke-width="64"
          stroke-dasharray="94 186.649" transform="rotate(-100.05 512 512)"/>
  <!-- Inlay: clock face with quarter ticks -->
  <circle cx="512" cy="512" r="208" fill="#FBF4E6"/>
  <g stroke="#0C1631" stroke-width="18" stroke-linecap="round">
    <line x1="512" y1="322" x2="512" y2="340"/>
    <line x1="702" y1="512" x2="684" y2="512"/>
    <line x1="512" y1="702" x2="512" y2="684"/>
    <line x1="322" y1="512" x2="340" y2="512"/>
  </g>
  <!-- Elapsed-time wedge from 12 to 4 o'clock, swept by a single hand -->
  <path d="M512 512 L512 362 A150 150 0 0 1 641.9 587 Z" fill="#F3A83B"/>
  <line x1="512" y1="512" x2="631.5" y2="581" stroke="#0C1631" stroke-width="30" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="30" fill="#0C1631"/>
</svg>
