[workspace]
members = ["crates/mtt-core", "crates/mtt-wasm", "src-tauri"]
resolver = "3"

[workspace.package]
version = "1.0.0"
license = "MIT"
edition = "2024"
rust-version = "1.85"

# Thin LTO keeps release builds of the desktop app (twice for the universal macOS
# bundle) within CI limits; scripts/wasm.mjs turns on full LTO for the smaller wasm build.
[profile.release]
lto = "thin"
panic = "abort"
strip = true
