[package]
name = "mtt"
description = "Poker tournament director for live events"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Mendel Teichman"]
repository = "https://github.com/maynetee/MTT"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's (see
# https://github.com/rust-lang/cargo/issues/8519).
name = "mtt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
mtt-core = { path = "../crates/mtt-core" }
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
percent-encoding = "2.3"

[dev-dependencies]
tauri = { version = "2.11.6", features = ["test"] }
tempfile = "3"
